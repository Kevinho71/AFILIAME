name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  frontend-ci:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck y build de producción
        run: npm run build

      - name: Auditoría de dependencias (informativa)
        run: npm audit --audit-level=high
        continue-on-error: true
